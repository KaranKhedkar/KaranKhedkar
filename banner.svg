<svg width="1400" height="360" viewBox="0 0 1400 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="55%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#110A1F"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B5CFF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>


  <!-- =========================
       BACKGROUND
  ========================== -->

  <rect width="1400" height="360" fill="url(#bg)"/>


  <!-- Ambient glows -->

  <circle cx="180" cy="170"
          r="230"
          fill="url(#glow)"
          filter="url(#blur)"/>

  <circle cx="1220" cy="170"
          r="230"
          fill="url(#glow)"
          filter="url(#blur)"/>


  <!-- =========================
       SUBTLE GRID
  ========================== -->

  <g opacity=".06" stroke="#8B9AFF">

    <path d="M0 60H1400"/>
    <path d="M0 120H1400"/>
    <path d="M0 180H1400"/>
    <path d="M0 240H1400"/>
    <path d="M0 300H1400"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>
    <path d="M1200 0V360"/>
    <path d="M1300 0V360"/>

  </g>


  <!-- =========================
       LEFT CIRCUIT
  ========================== -->

  <g fill="none"
     stroke="url(#accent)"
     stroke-width="1.5"
     opacity=".45">

    <path d="M0 95H110L145 130H245"/>
    <path d="M0 245H80L120 205H220"/>
    <path d="M145 130V175L185 215H270"/>

  </g>

  <g fill="#8B5CF6">

    <circle cx="110" cy="95" r="3"/>
    <circle cx="145" cy="130" r="3"/>
    <circle cx="245" cy="130" r="3"/>
    <circle cx="120" cy="205" r="3"/>
    <circle cx="220" cy="205" r="3"/>

  </g>


  <!-- =========================
       RIGHT CIRCUIT
  ========================== -->

  <g fill="none"
     stroke="url(#accent)"
     stroke-width="1.5"
     opacity=".45">

    <path d="M1400 95H1290L1255 130H1155"/>
    <path d="M1400 245H1320L1280 205H1180"/>
    <path d="M1255 130V175L1215 215H1130"/>

  </g>

  <g fill="#8B5CF6">

    <circle cx="1290" cy="95" r="3"/>
    <circle cx="1255" cy="130" r="3"/>
    <circle cx="1155" cy="130" r="3"/>
    <circle cx="1280" cy="205" r="3"/>
    <circle cx="1180" cy="205" r="3"/>

  </g>


  <!-- =========================
       ABSTRACT AI NODES
  ========================== -->

  <g fill="none"
     stroke="#6366F1"
     stroke-width="1.5"
     opacity=".35">

    <!-- Left neural cluster -->
    <path d="M175 75L225 105L195 155L245 180"/>
    <path d="M225 105L270 80L245 180"/>
    <path d="M195 155L160 205L245 180"/>

    <!-- Right neural cluster -->
    <path d="M1225 75L1175 105L1205 155L1155 180"/>
    <path d="M1175 105L1130 80L1155 180"/>
    <path d="M1205 155L1240 205L1155 180"/>

  </g>

  <g fill="#A78BFA">

    <circle cx="175" cy="75" r="3"/>
    <circle cx="225" cy="105" r="4"/>
    <circle cx="195" cy="155" r="3"/>
    <circle cx="245" cy="180" r="4"/>
    <circle cx="270" cy="80" r="3"/>

    <circle cx="1225" cy="75" r="3"/>
    <circle cx="1175" cy="105" r="4"/>
    <circle cx="1205" cy="155" r="3"/>
    <circle cx="1155" cy="180" r="4"/>
    <circle cx="1130" cy="80" r="3"/>

  </g>


  <!-- =========================
       CENTER CONTENT
  ========================== -->

  <g font-family="monospace"
     text-anchor="middle">

    <!-- Terminal lines -->

    <text x="700"
          y="72"
          fill="#8B5CF6"
          font-size="17">

      &gt; building intelligent systems

    </text>

    <text x="700"
          y="98"
          fill="#67E8F9"
          font-size="17">

      &gt; turning ideas into real-world impact

    </text>


    <!-- Name -->

    <text x="700"
          y="172"
          fill="#F8FAFC"
          font-size="54"
          font-weight="700"
          letter-spacing="2">

      KARAN KHEDKAR

    </text>


    <!-- Role -->

    <text x="700"
          y="210"
          fill="#A78BFA"
          font-size="20"
          letter-spacing="2">

      AI / ML  ·  GENAI  ·  FULL-STACK

    </text>


    <!-- Accent line -->

    <rect x="515"
          y="232"
          width="370"
          height="2"
          rx="1"
          fill="url(#accent)"/>


    <!-- Description -->

    <text x="700"
          y="270"
          fill="#CBD5E1"
          font-size="15">

      AI-first systems · Agentic workflows · RAG · Machine Learning

    </text>


    <!-- Small status -->

    <text x="700"
          y="305"
          fill="#64748B"
          font-size="13">

      VJTI · Mumbai, India

    </text>

  </g>


  <!-- =========================
       CENTER DECORATIVE NODES
  ========================== -->

  <g fill="#C4B5FD">

    <circle cx="470" cy="55" r="1.5"/>
    <circle cx="505" cy="320" r="1"/>
    <circle cx="930" cy="55" r="1.5"/>
    <circle cx="895" cy="320" r="1"/>
    <circle cx="350" cy="275" r="1"/>
    <circle cx="1050" cy="275" r="1"/>

  </g>

</svg>

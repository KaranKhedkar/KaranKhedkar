<svg width="1400" height="360" viewBox="0 0 1400 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="55%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#110A1F"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B5CFF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>

  <!-- Background -->

  <rect width="1400" height="360" fill="url(#bg)"/>

  <!-- Ambient glow -->

  <circle cx="1120" cy="120" r="230" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="300" cy="320" r="180" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Grid -->

  <g opacity=".08" stroke="#8B9AFF">

    <path d="M0 80H1400"/>
    <path d="M0 160H1400"/>
    <path d="M0 240H1400"/>
    <path d="M0 320H1400"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>
    <path d="M1200 0V360"/>
    <path d="M1300 0V360"/>

  </g>

  <!-- Decorative circuit lines -->

  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".55">

    <path d="M850 70H980L1010 100H1110"/>
    <path d="M910 160H1040L1070 130H1210"/>
    <path d="M1000 230H1080L1110 200H1280"/>
    <path d="M1120 90V150L1150 180V260"/>
    <path d="M1240 70V120L1270 150V230"/>

  </g>

  <!-- Circuit nodes -->

  <g fill="#8B5CF6">

    <circle cx="980" cy="70" r="3"/>
    <circle cx="1110" cy="100" r="3"/>
    <circle cx="1040" cy="160" r="3"/>
    <circle cx="1210" cy="130" r="3"/>
    <circle cx="1080" cy="230" r="3"/>
    <circle cx="1280" cy="200" r="3"/>
    <circle cx="1120" cy="90" r="3"/>
    <circle cx="1150" cy="180" r="3"/>

  </g>

  <!-- Abstract AI neural structure -->

  <g fill="none" stroke="#6366F1" stroke-width="1.5" opacity=".45">

    <path d="M1160 90L1210 120L1260 95"/>
    <path d="M1160 90L1190 170L1260 95"/>
    <path d="M1190 170L1240 210L1300 170"/>
    <path d="M1210 120L1240 210"/>
    <path d="M1260 95L1300 170"/>

  </g>

  <g fill="#A78BFA">

    <circle cx="1160" cy="90" r="4"/>
    <circle cx="1210" cy="120" r="4"/>
    <circle cx="1260" cy="95" r="4"/>
    <circle cx="1190" cy="170" r="4"/>
    <circle cx="1240" cy="210" r="4"/>
    <circle cx="1300" cy="170" r="4"/>

  </g>

  <!-- Terminal-style identity -->

  <g font-family="monospace">

    <text x="90" y="105"
          fill="#8B5CF6"
          font-size="18">
      &gt; building intelligent systems
    </text>

    <text x="90" y="135"
          fill="#67E8F9"
          font-size="18">
      &gt; turning ideas into real-world impact
    </text>

    <text x="90" y="205"
          fill="#F8FAFC"
          font-size="54"
          font-weight="700">
      KARAN KHEDKAR
    </text>

    <text x="94" y="242"
          fill="#A78BFA"
          font-size="20">
      AI / ML  ·  GENAI  ·  FULL-STACK
    </text>

    <rect x="94" y="270" width="380" height="2"
          fill="url(#accent)"/>

    <text x="94" y="305"
          fill="#94A3B8"
          font-size="15">
      AI-first systems · Agentic workflows · RAG · ML
    </text>

  </g>

  <!-- Small decorative stars -->

  <g fill="#C4B5FD">

    <circle cx="720" cy="65" r="1.5"/>
    <circle cx="780" cy="120" r="1"/>
    <circle cx="870" cy="40" r="1.5"/>
    <circle cx="950" cy="290" r="1"/>
    <circle cx="1340" cy="80" r="1.5"/>
    <circle cx="1370" cy="280" r="1"/>

  </g>

</svg>

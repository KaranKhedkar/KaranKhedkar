
<svg
  width="1400"
  height="480"
  viewBox="0 0 1400 480"
  xmlns="http://www.w3.org/2000/svg"
>

<defs>

  <!-- Background -->
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05060A"/>
    <stop offset="45%" stop-color="#090B14"/>
    <stop offset="100%" stop-color="#100817"/>
  </linearGradient>

  <!-- Purple/Cyan accent -->
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1"/>
    <stop offset="50%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>

  <!-- Purple glow -->
  <radialGradient id="purpleGlow">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <!-- Cyan glow -->
  <radialGradient id="cyanGlow">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity=".15"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <!-- Glow filter -->
  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="5"/>
  </filter>

</defs>


<!-- =====================================================
     BACKGROUND
====================================================== -->

<rect
  width="1400"
  height="480"
  fill="url(#background)"
/>


<!-- Ambient lighting -->

<circle
  cx="180"
  cy="180"
  r="280"
  fill="url(#purpleGlow)"
  filter="url(#blur)"
/>

<circle
  cx="1220"
  cy="280"
  r="300"
  fill="url(#cyanGlow)"
  filter="url(#blur)"
/>


<!-- =====================================================
     CYBER GRID
====================================================== -->

<g
  stroke="#6366F1"
  stroke-width="1"
  opacity=".055"
>

  <!-- horizontal -->
  <path d="M0 80H1400"/>
  <path d="M0 160H1400"/>
  <path d="M0 240H1400"/>
  <path d="M0 320H1400"/>
  <path d="M0 400H1400"/>

  <!-- vertical -->
  <path d="M100 0V480"/>
  <path d="M200 0V480"/>
  <path d="M300 0V480"/>
  <path d="M400 0V480"/>
  <path d="M500 0V480"/>
  <path d="M600 0V480"/>
  <path d="M700 0V480"/>
  <path d="M800 0V480"/>
  <path d="M900 0V480"/>
  <path d="M1000 0V480"/>
  <path d="M1100 0V480"/>
  <path d="M1200 0V480"/>
  <path d="M1300 0V480"/>

</g>


<!-- =====================================================
     SCANLINES
====================================================== -->

<g opacity=".035">

  <rect x="0" y="40" width="1400" height="1" fill="#FFFFFF"/>
  <rect x="0" y="120" width="1400" height="1" fill="#FFFFFF"/>
  <rect x="0" y="200" width="1400" height="1" fill="#FFFFFF"/>
  <rect x="0" y="280" width="1400" height="1" fill="#FFFFFF"/>
  <rect x="0" y="360" width="1400" height="1" fill="#FFFFFF"/>
  <rect x="0" y="440" width="1400" height="1" fill="#FFFFFF"/>

</g>


<!-- =====================================================
     LEFT CIRCUIT SYSTEM
====================================================== -->

<g
  fill="none"
  stroke="url(#neon)"
  stroke-width="1.5"
  opacity=".5"
>

  <path d="M0 120H100L135 155H260"/>
  <path d="M0 330H90L130 290H230"/>
  <path d="M80 60V105L115 140"/>
  <path d="M150 400V350L200 300"/>

</g>


<g fill="#8B5CF6">

  <circle cx="100" cy="120" r="3"/>
  <circle cx="135" cy="155" r="3"/>
  <circle cx="260" cy="155" r="3"/>

  <circle cx="90" cy="330" r="3"/>
  <circle cx="130" cy="290" r="3"/>
  <circle cx="230" cy="290" r="3"/>

</g>


<!-- =====================================================
     RIGHT CIRCUIT SYSTEM
====================================================== -->

<g
  fill="none"
  stroke="url(#neon)"
  stroke-width="1.5"
  opacity=".5"
>

  <path d="M1400 120H1300L1265 155H1140"/>
  <path d="M1400 330H1310L1270 290H1170"/>
  <path d="M1320 60V105L1285 140"/>
  <path d="M1250 400V350L1200 300"/>

</g>


<g fill="#22D3EE">

  <circle cx="1300" cy="120" r="3"/>
  <circle cx="1265" cy="155" r="3"/>
  <circle cx="1140" cy="155" r="3"/>

  <circle cx="1310" cy="330" r="3"/>
  <circle cx="1270" cy="290" r="3"/>
  <circle cx="1170" cy="290" r="3"/>

</g>


<!-- =====================================================
     NEURAL NETWORK
====================================================== -->

<g
  fill="none"
  stroke="#8B5CF6"
  stroke-width="1"
  opacity=".28"
>

  <path d="M1080 80L1140 120L1190 85"/>
  <path d="M1140 120L1170 190L1240 145"/>
  <path d="M1080 80L1100 170L1170 190"/>
  <path d="M1100 170L1050 240L1170 190"/>
  <path d="M1170 190L1210 250L1280 220"/>

</g>


<g fill="#A78BFA">

  <circle cx="1080" cy="80" r="4"/>
  <circle cx="1140" cy="120" r="4"/>
  <circle cx="1190" cy="85" r="4"/>
  <circle cx="1100" cy="170" r="4"/>
  <circle cx="1170" cy="190" r="4"/>
  <circle cx="1240" cy="145" r="4"/>
  <circle cx="1050" cy="240" r="4"/>
  <circle cx="1210" cy="250" r="4"/>
  <circle cx="1280" cy="220" r="4"/>

</g>


<!-- =====================================================
     LEFT DECORATIVE AI NODES
====================================================== -->

<g
  fill="none"
  stroke="#22D3EE"
  stroke-width="1"
  opacity=".25"
>

  <path d="M170 250L220 210L275 245L235 300L170 250"/>
  <path d="M220 210L235 300"/>
  <path d="M170 250L275 245"/>

</g>


<g fill="#22D3EE">

  <circle cx="170" cy="250" r="3"/>
  <circle cx="220" cy="210" r="3"/>
  <circle cx="275" cy="245" r="3"/>
  <circle cx="235" cy="300" r="3"/>

</g>


<!-- =====================================================
     CENTER CONTENT
====================================================== -->

<g font-family="monospace" text-anchor="middle">

  <!-- status -->

  <text
    x="700"
    y="95"
    fill="#22D3EE"
    font-size="15"
    letter-spacing="4"
  >
    SYSTEM // ONLINE
  </text>


  <!-- terminal -->

  <text
    x="700"
    y="130"
    fill="#8B5CF6"
    font-size="16"
  >
    &gt; initializing intelligent systems...
  </text>


  <!-- name -->

  <text
    x="700"
    y="215"
    fill="#F8FAFC"
    font-size="64"
    font-weight="700"
    letter-spacing="6"
  >
    KARAN KHEDKAR
  </text>


  <!-- role -->

  <text
    x="700"
    y="260"
    fill="#A78BFA"
    font-size="21"
    letter-spacing="4"
  >
    AI / ML · GENAI · FULL-STACK
  </text>


  <!-- neon divider -->

  <rect
    x="480"
    y="285"
    width="440"
    height="2"
    rx="1"
    fill="url(#neon)"
  />


  <!-- description -->

  <text
    x="700"
    y="325"
    fill="#CBD5E1"
    font-size="16"
  >
    building intelligent systems where AI meets software engineering
  </text>


  <!-- location -->

  <text
    x="700"
    y="365"
    fill="#64748B"
    font-size="13"
    letter-spacing="2"
  >
    VJTI · MUMBAI · INDIA
  </text>


  <!-- bottom terminal -->

  <text
    x="700"
    y="420"
    fill="#6366F1"
    font-size="13"
  >
    [ AGENTIC AI ] [ RAG ] [ MACHINE LEARNING ] [ SYSTEMS ]
  </text>

</g>


<!-- =====================================================
     CORNER MARKERS
====================================================== -->

<g
  fill="#8B5CF6"
  opacity=".7"
>

  <rect x="35" y="35" width="40" height="2"/>
  <rect x="35" y="35" width="2" height="40"/>

  <rect x="1325" y="35" width="40" height="2"/>
  <rect x="1363" y="35" width="2" height="40"/>

  <rect x="35" y="443" width="40" height="2"/>
  <rect x="35" y="405" width="2" height="40"/>

  <rect x="1325" y="443" width="40" height="2"/>
  <rect x="1363" y="405" width="2" height="40"/>

</g>


<!-- =====================================================
     SMALL PARTICLES
====================================================== -->

<g fill="#C4B5FD">

  <circle cx="350" cy="90" r="1.5"/>
  <circle cx="420" cy="390" r="1"/>
  <circle cx="970" cy="70" r="1"/>
  <circle cx="1010" cy="400" r="1.5"/>
  <circle cx="310" cy="360" r="1"/>
  <circle cx="1090" cy="350" r="1"/>

</g>

</svg>

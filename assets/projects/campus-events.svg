<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070C"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0C1019"/>
    </linearGradient>

    <!-- Main network gradient -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Purple -->
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6366F1" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle
    cx="1000"
    cy="180"
    r="270"
    fill="url(#glow)"
    filter="url(#blur)"
  />


  <!-- =====================================================
       DIGITAL GRID
  ====================================================== -->

  <g stroke="#6366F1"
     stroke-width="1"
     opacity=".045">

    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 300H1200"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>

  </g>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="60"
      y="48"
      fill="#22D3EE"
      font-size="13"
      letter-spacing="3"
    >
      PROJECT // 004
    </text>

    <text
      x="1140"
      y="48"
      fill="#A855F7"
      font-size="12"
      text-anchor="end"
      letter-spacing="2"
    >
      CAMPUS_NETWORK
    </text>

  </g>


  <!-- =====================================================
       LEFT — CAMPUS NETWORK
  ====================================================== -->

  <g transform="translate(55 75)">

    <!-- network glow -->

    <g
      fill="none"
      stroke="#22D3EE"
      stroke-width="5"
      opacity=".08"
      filter="url(#softGlow)"
    >

      <path d="M90 75L170 125L95 180"/>
      <path d="M90 75L205 70L170 125"/>
      <path d="M170 125L205 70"/>
      <path d="M170 125L235 175"/>
      <path d="M95 180L235 175"/>

    </g>


    <!-- network connections -->

    <g
      fill="none"
      stroke="url(#neon)"
      stroke-width="1.7"
      opacity=".65"
    >

      <path d="M90 75L170 125L95 180"/>
      <path d="M90 75L205 70L170 125"/>
      <path d="M170 125L205 70"/>
      <path d="M170 125L235 175"/>
      <path d="M95 180L235 175"/>

    </g>


    <!-- central node -->

    <circle
      cx="170"
      cy="125"
      r="28"
      fill="#080C14"
      stroke="#A855F7"
      stroke-width="2"
    />

    <circle
      cx="170"
      cy="125"
      r="19"
      fill="none"
      stroke="#6366F1"
      stroke-width="1"
      opacity=".7"
    />


    <!-- campus icon -->

    <g
      fill="none"
      stroke="#C4B5FD"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >

      <path d="M158 118L170 111L182 118"/>
      <path d="M160 119V136H180V119"/>
      <path d="M165 136V126H175V136"/>

    </g>


    <!-- user nodes -->

    <g>

      <!-- student -->

      <circle
        cx="90"
        cy="75"
        r="13"
        fill="#071318"
        stroke="#22D3EE"
        stroke-width="2"
      />

      <circle
        cx="90"
        cy="75"
        r="4"
        fill="#22D3EE"
      />


      <!-- organizer -->

      <circle
        cx="205"
        cy="70"
        r="13"
        fill="#0D0A16"
        stroke="#A855F7"
        stroke-width="2"
      />

      <circle
        cx="205"
        cy="70"
        r="4"
        fill="#A855F7"
      />


      <!-- admin -->

      <circle
        cx="95"
        cy="180"
        r="13"
        fill="#0D0A16"
        stroke="#6366F1"
        stroke-width="2"
      />

      <circle
        cx="95"
        cy="180"
        r="4"
        fill="#6366F1"
      />


      <!-- event -->

      <circle
        cx="235"
        cy="175"
        r="13"
        fill="#071318"
        stroke="#67E8F9"
        stroke-width="2"
      />

      <circle
        cx="235"
        cy="175"
        r="4"
        fill="#67E8F9"
      />

    </g>


    <!-- labels -->

    <g
      font-family="monospace"
      font-size="9"
    >

      <text x="68" y="52" fill="#64748B">
        STUDENT
      </text>

      <text x="188" y="47" fill="#64748B">
        ORGANIZER
      </text>

      <text x="72" y="208" fill="#64748B">
        ADMIN
      </text>

      <text x="220" y="202" fill="#64748B">
        EVENT
      </text>

    </g>

  </g>


  <!-- =====================================================
       MAIN TITLE
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="330"
      y="108"
      fill="#F8FAFC"
      font-size="39"
      font-weight="700"
      letter-spacing="2"
    >
      CAMPUS EVENTS
    </text>

    <text
      x="332"
      y="142"
      fill="#67E8F9"
      font-size="15"
      letter-spacing="3"
    >
      CONNECTED CAMPUS PLATFORM
    </text>

    <rect
      x="332"
      y="164"
      width="350"
      height="2"
      fill="url(#neon)"
    />

    <text
      x="332"
      y="201"
      fill="#CBD5E1"
      font-size="14"
    >
      One platform connecting students,
    </text>

    <text
      x="332"
      y="223"
      fill="#CBD5E1"
      font-size="14"
    >
      organizers and campus administration.
    </text>

  </g>


  <!-- =====================================================
       RIGHT — EVENT SYSTEM
  ====================================================== -->

  <g transform="translate(790 72)">

    <!-- outer interface -->

    <rect
      x="0"
      y="0"
      width="350"
      height="185"
      rx="8"
      fill="#070B12"
      stroke="#263142"
      stroke-width="1"
    />


    <!-- top bar -->

    <rect
      x="0"
      y="0"
      width="350"
      height="32"
      rx="8"
      fill="#0A1019"
    />

    <circle cx="18" cy="16" r="3" fill="#22D3EE"/>
    <circle cx="30" cy="16" r="3" fill="#6366F1"/>
    <circle cx="42" cy="16" r="3" fill="#A855F7"/>

    <text
      x="330"
      y="20"
      fill="#64748B"
      font-family="monospace"
      font-size="9"
      text-anchor="end"
    >
      EVENT_HUB
    </text>


    <!-- event cards -->

    <g font-family="monospace">

      <rect
        x="20"
        y="50"
        width="145"
        height="52"
        rx="5"
        fill="#0A131B"
        stroke="#164E63"
      />

      <rect
        x="185"
        y="50"
        width="145"
        height="52"
        rx="5"
        fill="#100B19"
        stroke="#4C1D95"
      />

      <rect
        x="20"
        y="118"
        width="145"
        height="52"
        rx="5"
        fill="#0A131B"
        stroke="#164E63"
      />

      <rect
        x="185"
        y="118"
        width="145"
        height="52"
        rx="5"
        fill="#100B19"
        stroke="#4C1D95"
      />


      <!-- card indicators -->

      <circle cx="38" cy="68" r="4" fill="#22D3EE"/>
      <circle cx="203" cy="68" r="4" fill="#A855F7"/>
      <circle cx="38" cy="136" r="4" fill="#22D3EE"/>
      <circle cx="203" cy="136" r="4" fill="#A855F7"/>


      <!-- card text -->

      <text x="50" y="71" fill="#CBD5E1" font-size="9">
        TECH EVENT
      </text>

      <text x="215" y="71" fill="#CBD5E1" font-size="9">
        CULTURAL
      </text>

      <text x="50" y="139" fill="#CBD5E1" font-size="9">
        WORKSHOP
      </text>

      <text x="215" y="139" fill="#CBD5E1" font-size="9">
        CAMPUS FEST
      </text>

      <text x="38" y="89" fill="#64748B" font-size="8">
        128 REGISTERED
      </text>

      <text x="203" y="89" fill="#64748B" font-size="8">
        342 REGISTERED
      </text>

      <text x="38" y="157" fill="#64748B" font-size="8">
        76 REGISTERED
      </text>

      <text x="203" y="157" fill="#64748B" font-size="8">
        514 REGISTERED
      </text>

    </g>

  </g>


  <!-- =====================================================
       PLATFORM PIPELINE
  ====================================================== -->

  <g
    transform="translate(330 270)"
    font-family="monospace"
  >

    <!-- connectors -->

    <g
      stroke="url(#neon)"
      stroke-width="1.5"
      opacity=".7"
    >

      <path d="M90 24H125"/>
      <path d="M220 24H255"/>
      <path d="M350 24H385"/>

    </g>


    <!-- nodes -->

    <g>

      <rect
        x="0"
        y="0"
        width="90"
        height="48"
        rx="6"
        fill="#071318"
        stroke="#22D3EE"
      />

      <rect
        x="125"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#0D0A16"
        stroke="#6366F1"
      />

      <rect
        x="255"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#0D0A16"
        stroke="#A855F7"
      />

      <rect
        x="385"
        y="0"
        width="90"
        height="48"
        rx="6"
        fill="#071318"
        stroke="#22D3EE"
      />

    </g>


    <g
      fill="#CBD5E1"
      font-size="10"
      text-anchor="middle"
    >

      <text x="45" y="29">
        DISCOVER
      </text>

      <text x="172" y="29">
        REGISTER
      </text>

      <text x="302" y="29">
        ORGANIZE
      </text>

      <text x="430" y="29">
        CONNECT
      </text>

    </g>

  </g>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <g font-family="monospace">

    <circle
      cx="70"
      cy="320"
      r="4"
      fill="#22D3EE"
    />

    <text
      x="85"
      y="325"
      fill="#64748B"
      font-size="11"
      letter-spacing="1"
    >
      CAMPUS PLATFORM // ROLE-BASED // REAL-TIME // ANALYTICS
    </text>

  </g>


  <!-- =====================================================
       CORNER MARKERS
  ====================================================== -->

  <g fill="#22D3EE" opacity=".7">

    <rect x="25" y="25" width="35" height="2"/>
    <rect x="25" y="25" width="2" height="35"/>

    <rect x="1140" y="25" width="35" height="2"/>
    <rect x="1173" y="25" width="2" height="35"/>

    <rect x="25" y="333" width="35" height="2"/>
    <rect x="25" y="300" width="2" height="35"/>

    <rect x="1140" y="333" width="35" height="2"/>
    <rect x="1173" y="300" width="2" height="35"/>

  </g>


  <!-- =====================================================
       PARTICLES
  ====================================================== -->

  <g fill="#C4B5FD">

    <circle cx="285" cy="70" r="1"/>
    <circle cx="670" cy="75" r="1.5"/>
    <circle cx="710" cy="310" r="1"/>
    <circle cx="1080" cy="285" r="1.5"/>
    <circle cx="1130" cy="110" r="1"/>

  </g>

</svg>

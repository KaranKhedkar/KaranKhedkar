<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080B"/>
      <stop offset="50%" stop-color="#071015"/>
      <stop offset="100%" stop-color="#0B1114"/>
    </linearGradient>

    <!-- Financial accent -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>

    <!-- Secondary accent -->
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle
    cx="1040"
    cy="170"
    r="260"
    fill="url(#glow)"
    filter="url(#blur)"
  />


  <!-- =====================================================
       DATA GRID
  ====================================================== -->

  <g stroke="#22D3EE"
     stroke-width="1"
     opacity=".045">

    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 300H1200"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>

  </g>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="60"
      y="48"
      fill="#22D3EE"
      font-size="13"
      letter-spacing="3"
    >
      PROJECT // 002
    </text>

    <text
      x="1140"
      y="48"
      fill="#14B8A6"
      font-size="12"
      text-anchor="end"
      letter-spacing="2"
    >
      FINANCIAL_INTELLIGENCE
    </text>

  </g>


  <!-- =====================================================
       LEFT — FINANCIAL SYMBOL
  ====================================================== -->

  <g transform="translate(65 92)">

    <!-- outer glow -->

    <circle
      cx="100"
      cy="100"
      r="92"
      fill="none"
      stroke="#22D3EE"
      stroke-width="8"
      opacity=".10"
      filter="url(#softGlow)"
    />

    <!-- outer ring -->

    <circle
      cx="100"
      cy="100"
      r="82"
      fill="#071014"
      stroke="url(#neon)"
      stroke-width="2"
    />

    <circle
      cx="100"
      cy="100"
      r="67"
      fill="none"
      stroke="#22D3EE"
      stroke-width="1"
      opacity=".3"
    />

    <!-- dollar symbol -->

    <g
      fill="none"
      stroke="url(#neon)"
      stroke-width="5"
      stroke-linecap="round"
    >

      <path d="M100 45V155"/>

      <path
        d="M125 70
           C118 58 105 53 91 55
           C74 57 66 67 68 79
           C70 93 84 98 101 102
           C118 106 132 112 132 128
           C132 143 118 153 101 154
           C84 155 70 148 64 136"
      />

    </g>

    <!-- small data nodes -->

    <g fill="#A3E635">

      <circle cx="45" cy="55" r="3"/>
      <circle cx="158" cy="65" r="3"/>
      <circle cx="160" cy="145" r="3"/>
      <circle cx="40" cy="150" r="3"/>

    </g>

  </g>


  <!-- =====================================================
       MAIN TITLE
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="300"
      y="110"
      fill="#F8FAFC"
      font-size="44"
      font-weight="700"
      letter-spacing="3"
    >
      FINSIGHT AI
    </text>

    <text
      x="302"
      y="142"
      fill="#67E8F9"
      font-size="15"
      letter-spacing="3"
    >
      FINANCIAL INTELLIGENCE ENGINE
    </text>

    <rect
      x="302"
      y="164"
      width="350"
      height="2"
      fill="url(#neon)"
    />

    <text
      x="302"
      y="200"
      fill="#CBD5E1"
      font-size="14"
    >
      Understand your money through
    </text>

    <text
      x="302"
      y="222"
      fill="#CBD5E1"
      font-size="14"
    >
      machine learning and conversational AI.
    </text>

  </g>


  <!-- =====================================================
       FINANCIAL GRAPH
  ====================================================== -->

  <g transform="translate(700 72)">

    <!-- chart area -->

    <rect
      x="0"
      y="0"
      width="430"
      height="185"
      rx="8"
      fill="#060B0E"
      stroke="#1E293B"
      stroke-width="1"
    />


    <!-- chart grid -->

    <g
      stroke="#22D3EE"
      stroke-width="1"
      opacity=".08"
    >

      <path d="M25 35H405"/>
      <path d="M25 75H405"/>
      <path d="M25 115H405"/>
      <path d="M25 155H405"/>

      <path d="M85 20V165"/>
      <path d="M145 20V165"/>
      <path d="M205 20V165"/>
      <path d="M265 20V165"/>
      <path d="M325 20V165"/>
      <path d="M385 20V165"/>

    </g>


    <!-- forecast area -->

    <path
      d="
        M25 140
        L65 130
        L105 135
        L145 105
        L185 115
        L225 82
        L265 94
        L305 65
        L345 72
        L385 40
      "
      fill="none"
      stroke="url(#neon)"
      stroke-width="3"
    />


    <!-- forecast extension -->

    <path
      d="
        M385 40
        L405 52
      "
      fill="none"
      stroke="#A855F7"
      stroke-width="3"
      stroke-dasharray="6 5"
    />


    <!-- graph nodes -->

    <g fill="#22D3EE">

      <circle cx="25" cy="140" r="3"/>
      <circle cx="105" cy="135" r="3"/>
      <circle cx="185" cy="115" r="3"/>
      <circle cx="265" cy="94" r="3"/>
      <circle cx="345" cy="72" r="3"/>
      <circle cx="385" cy="40" r="4"/>

    </g>


    <!-- chart labels -->

    <g
      font-family="monospace"
      font-size="10"
    >

      <text x="25" y="178" fill="#64748B">
        HISTORICAL
      </text>

      <text x="315" y="178" fill="#A855F7">
        FORECAST
      </text>

    </g>

  </g>


  <!-- =====================================================
       AI DATA FLOW
  ====================================================== -->

  <g
    transform="translate(300 265)"
    font-family="monospace"
  >

    <!-- connectors -->

    <g
      stroke="url(#neon)"
      stroke-width="1.5"
      opacity=".7"
    >

      <path d="M80 24H125"/>
      <path d="M220 24H265"/>
      <path d="M360 24H405"/>

    </g>


    <!-- nodes -->

    <g>

      <rect
        x="0"
        y="0"
        width="80"
        height="48"
        rx="6"
        fill="#071014"
        stroke="#22D3EE"
      />

      <rect
        x="125"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#071014"
        stroke="#14B8A6"
      />

      <rect
        x="265"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#071014"
        stroke="#8B5CF6"
      />

      <rect
        x="405"
        y="0"
        width="90"
        height="48"
        rx="6"
        fill="#071014"
        stroke="#A3E635"
      />

    </g>


    <g
      fill="#CBD5E1"
      font-size="10"
      text-anchor="middle"
    >

      <text x="40" y="29">
        DATA
      </text>

      <text x="172" y="29">
        ANALYZE
      </text>

      <text x="312" y="29">
        PREDICT
      </text>

      <text x="450" y="29">
        INSIGHT
      </text>

    </g>

  </g>


  <!-- =====================================================
       BOTTOM STATUS
  ====================================================== -->

  <g font-family="monospace">

    <circle
      cx="72"
      cy="320"
      r="4"
      fill="#22D3EE"
    />

    <text
      x="87"
      y="325"
      fill="#64748B"
      font-size="11"
      letter-spacing="1"
    >
      ML ENGINE // FORECASTING // ANOMALY DETECTION // AGENTS
    </text>

  </g>


  <!-- =====================================================
       CORNER MARKERS
  ====================================================== -->

  <g fill="#22D3EE" opacity=".7">

    <rect x="25" y="25" width="35" height="2"/>
    <rect x="25" y="25" width="2" height="35"/>

    <rect x="1140" y="25" width="35" height="2"/>
    <rect x="1173" y="25" width="2" height="35"/>

    <rect x="25" y="333" width="35" height="2"/>
    <rect x="25" y="300" width="2" height="35"/>

    <rect x="1140" y="333" width="35" height="2"/>
    <rect x="1173" y="300" width="2" height="35"/>

  </g>

</svg>

<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07060B"/>
      <stop offset="50%" stop-color="#0D0A14"/>
      <stop offset="100%" stop-color="#0A1117"/>
    </linearGradient>

    <!-- Main optimization gradient -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#A855F7" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle
    cx="1010"
    cy="170"
    r="270"
    fill="url(#glow)"
    filter="url(#blur)"
  />


  <!-- =====================================================
       GRID
  ====================================================== -->

  <g stroke="#A855F7"
     stroke-width="1"
     opacity=".05">

    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 300H1200"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>

  </g>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="60"
      y="48"
      fill="#A855F7"
      font-size="13"
      letter-spacing="3"
    >
      PROJECT // 003
    </text>

    <text
      x="1140"
      y="48"
      fill="#22D3EE"
      font-size="12"
      text-anchor="end"
      letter-spacing="2"
    >
      OPTIMIZATION_ENGINE
    </text>

  </g>


  <!-- =====================================================
       LEFT — GENETIC ALGORITHM VISUAL
  ====================================================== -->

  <g transform="translate(55 85)">

    <!-- outer frame -->

    <rect
      x="0"
      y="0"
      width="205"
      height="190"
      rx="8"
      fill="#080810"
      stroke="#312447"
      stroke-width="1"
    />

    <!-- title -->

    <text
      x="20"
      y="28"
      fill="#64748B"
      font-family="monospace"
      font-size="10"
      letter-spacing="2"
    >
      EVOLUTION_ENGINE
    </text>


    <!-- population 1 -->

    <g transform="translate(20 48)">

      <text
        x="0"
        y="12"
        fill="#A78BFA"
        font-family="monospace"
        font-size="10"
      >
        POPULATION
      </text>

      <g fill="#1E293B"
         stroke="#6366F1"
         stroke-width="1">

        <rect x="0" y="25" width="28" height="18" rx="3"/>
        <rect x="34" y="25" width="28" height="18" rx="3"/>
        <rect x="68" y="25" width="28" height="18" rx="3"/>
        <rect x="102" y="25" width="28" height="18" rx="3"/>

      </g>

      <g fill="#8B5CF6">

        <circle cx="14" cy="34" r="3"/>
        <circle cx="48" cy="34" r="3"/>
        <circle cx="82" cy="34" r="3"/>
        <circle cx="116" cy="34" r="3"/>

      </g>

    </g>


    <!-- arrow -->

    <path
      d="M102 125L102 138"
      stroke="url(#neon)"
      stroke-width="2"
    />

    <path
      d="M97 134L102 140L107 134"
      fill="none"
      stroke="#A855F7"
      stroke-width="2"
    />


    <!-- optimized result -->

    <g transform="translate(20 148)">

      <text
        x="0"
        y="12"
        fill="#22D3EE"
        font-family="monospace"
        font-size="10"
      >
        OPTIMAL_STATE
      </text>

      <g fill="#0B1820"
         stroke="#22D3EE"
         stroke-width="1">

        <rect x="0" y="22" width="28" height="18" rx="3"/>
        <rect x="34" y="22" width="28" height="18" rx="3"/>
        <rect x="68" y="22" width="28" height="18" rx="3"/>
        <rect x="102" y="22" width="28" height="18" rx="3"/>

      </g>

      <g fill="#22D3EE">

        <circle cx="14" cy="31" r="3"/>
        <circle cx="48" cy="31" r="3"/>
        <circle cx="82" cy="31" r="3"/>
        <circle cx="116" cy="31" r="3"/>

      </g>

    </g>

  </g>


  <!-- =====================================================
       MAIN TITLE
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="300"
      y="108"
      fill="#F8FAFC"
      font-size="41"
      font-weight="700"
      letter-spacing="2"
    >
      NEP TIMETABLE
    </text>

    <text
      x="302"
      y="143"
      fill="#A78BFA"
      font-size="15"
      letter-spacing="3"
    >
      CONSTRAINT-DRIVEN OPTIMIZATION
    </text>

    <rect
      x="302"
      y="164"
      width="350"
      height="2"
      fill="url(#neon)"
    />

    <text
      x="302"
      y="200"
      fill="#CBD5E1"
      font-size="14"
    >
      Generating conflict-free academic
    </text>

    <text
      x="302"
      y="222"
      fill="#CBD5E1"
      font-size="14"
    >
      schedules through evolutionary optimization.
    </text>

  </g>


  <!-- =====================================================
       RIGHT — TIMETABLE MATRIX
  ====================================================== -->

  <g transform="translate(735 72)">

    <!-- frame -->

    <rect
      x="0"
      y="0"
      width="410"
      height="185"
      rx="8"
      fill="#070B10"
      stroke="#263142"
      stroke-width="1"
    />


    <!-- heading -->

    <text
      x="20"
      y="25"
      fill="#64748B"
      font-family="monospace"
      font-size="10"
      letter-spacing="2"
    >
      SCHEDULE_MATRIX
    </text>


    <!-- timetable grid -->

    <g stroke="#334155"
       stroke-width="1"
       opacity=".6">

      <!-- vertical -->

      <path d="M75 45V165"/>
      <path d="M145 45V165"/>
      <path d="M215 45V165"/>
      <path d="M285 45V165"/>
      <path d="M355 45V165"/>

      <!-- horizontal -->

      <path d="M20 75H390"/>
      <path d="M20 105H390"/>
      <path d="M20 135H390"/>

    </g>


    <!-- column labels -->

    <g
      font-family="monospace"
      font-size="8"
      fill="#64748B"
      text-anchor="middle"
    >

      <text x="110" y="40">MON</text>
      <text x="180" y="40">TUE</text>
      <text x="250" y="40">WED</text>
      <text x="320" y="40">THU</text>
      <text x="375" y="40">FRI</text>

    </g>


    <!-- schedule blocks -->

    <g>

      <rect
        x="82"
        y="80"
        width="52"
        height="18"
        rx="3"
        fill="#24143A"
        stroke="#A855F7"
      />

      <rect
        x="152"
        y="110"
        width="52"
        height="18"
        rx="3"
        fill="#0B2530"
        stroke="#22D3EE"
      />

      <rect
        x="222"
        y="80"
        width="52"
        height="18"
        rx="3"
        fill="#24143A"
        stroke="#8B5CF6"
      />

      <rect
        x="292"
        y="140"
        width="52"
        height="18"
        rx="3"
        fill="#0B2530"
        stroke="#22D3EE"
      />

      <rect
        x="352"
        y="110"
        width="28"
        height="18"
        rx="3"
        fill="#24143A"
        stroke="#A855F7"
      />

    </g>


    <!-- active cell -->

    <rect
      x="222"
      y="80"
      width="52"
      height="18"
      rx="3"
      fill="none"
      stroke="#C4B5FD"
      stroke-width="2"
      opacity=".8"
    />

  </g>


  <!-- =====================================================
       OPTIMIZATION PIPELINE
  ====================================================== -->

  <g
    transform="translate(300 270)"
    font-family="monospace"
  >

    <!-- connectors -->

    <g
      stroke="url(#neon)"
      stroke-width="1.5"
      opacity=".7"
    >

      <path d="M90 24H125"/>
      <path d="M220 24H255"/>
      <path d="M350 24H385"/>

    </g>


    <!-- nodes -->

    <g>

      <rect
        x="0"
        y="0"
        width="90"
        height="48"
        rx="6"
        fill="#090810"
        stroke="#8B5CF6"
      />

      <rect
        x="125"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#090810"
        stroke="#A855F7"
      />

      <rect
        x="255"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#090810"
        stroke="#8B5CF6"
      />

      <rect
        x="385"
        y="0"
        width="90"
        height="48"
        rx="6"
        fill="#081318"
        stroke="#22D3EE"
      />

    </g>


    <g
      fill="#CBD5E1"
      font-size="10"
      text-anchor="middle"
    >

      <text x="45" y="29">
        FITNESS
      </text>

      <text x="172" y="29">
        SELECTION
      </text>

      <text x="302" y="29">
        CROSSOVER
      </text>

      <text x="430" y="29">
        MUTATION
      </text>

    </g>

  </g>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <g font-family="monospace">

    <circle
      cx="70"
      cy="320"
      r="4"
      fill="#22D3EE"
    />

    <text
      x="85"
      y="325"
      fill="#64748B"
      font-size="11"
      letter-spacing="1"
    >
      GENETIC ALGORITHM // OPTIMIZATION // CONSTRAINT SOLVER
    </text>

  </g>


  <!-- =====================================================
       CORNER MARKERS
  ====================================================== -->

  <g fill="#A855F7"
     opacity=".7">

    <rect x="25" y="25" width="35" height="2"/>
    <rect x="25" y="25" width="2" height="35"/>

    <rect x="1140" y="25" width="35" height="2"/>
    <rect x="1173" y="25" width="2" height="35"/>

    <rect x="25" y="333" width="35" height="2"/>
    <rect x="25" y="300" width="2" height="35"/>

    <rect x="1140" y="333" width="35" height="2"/>
    <rect x="1173" y="300" width="2" height="35"/>

  </g>


  <!-- =====================================================
       PARTICLES
  ====================================================== -->

  <g fill="#C4B5FD">

    <circle cx="280" cy="70" r="1"/>
    <circle cx="650" cy="85" r="1.5"/>
    <circle cx="680" cy="310" r="1"/>
    <circle cx="1080" cy="290" r="1.5"/>
    <circle cx="1130" cy="110" r="1"/>

  </g>

</svg>

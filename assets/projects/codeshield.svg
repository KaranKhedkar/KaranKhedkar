<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060A"/>
      <stop offset="50%" stop-color="#0B0A16"/>
      <stop offset="100%" stop-color="#100817"/>
    </linearGradient>

    <!-- Main neon -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Shield gradient -->
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Ambient glow -->

  <circle cx="180" cy="180"
          r="230"
          fill="url(#glow)"
          filter="url(#blur)"/>

  <circle cx="1030" cy="170"
          r="220"
          fill="url(#glow)"
          filter="url(#blur)"/>


  <!-- =====================================================
       GRID
  ====================================================== -->

  <g stroke="#6366F1"
     stroke-width="1"
     opacity=".045">

    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 300H1200"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>

  </g>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <g font-family="monospace">

    <text x="70"
          y="55"
          fill="#8B5CF6"
          font-size="13"
          letter-spacing="3">

      PROJECT // 001

    </text>

    <text x="1130"
          y="55"
          fill="#22D3EE"
          font-size="12"
          text-anchor="end"
          letter-spacing="2">

      SECURITY_SYSTEM

    </text>

  </g>


  <!-- =====================================================
       SHIELD ICON
  ====================================================== -->

  <g transform="translate(85 100)">

    <!-- glow -->
    <path d="
      M70 0
      L135 25
      V85
      C135 130 105 155 70 175
      C35 155 5 130 5 85
      V25
      Z"
      fill="none"
      stroke="#8B5CF6"
      stroke-width="8"
      opacity=".18"
      filter="url(#softGlow)"
    />

    <!-- shield -->
    <path d="
      M70 0
      L135 25
      V85
      C135 130 105 155 70 175
      C35 155 5 130 5 85
      V25
      Z"
      fill="#090A13"
      stroke="url(#shield)"
      stroke-width="3"
    />

    <!-- inner shield -->
    <path d="
      M70 22
      L112 39
      V82
      C112 110 94 128 70 143
      C46 128 28 110 28 82
      V39
      Z"
      fill="none"
      stroke="#6366F1"
      stroke-width="1.5"
      opacity=".65"
    />

    <!-- code brackets -->

    <g fill="none"
       stroke="#22D3EE"
       stroke-width="3"
       stroke-linecap="round">

      <path d="M50 70L40 82L50 94"/>
      <path d="M90 70L100 82L90 94"/>

    </g>

    <path d="M60 100L80 64"
          stroke="#A855F7"
          stroke-width="3"
          stroke-linecap="round"/>

  </g>


  <!-- =====================================================
       MAIN TITLE
  ====================================================== -->

  <g font-family="monospace">

    <text x="290"
          y="120"
          fill="#F8FAFC"
          font-size="46"
          font-weight="700"
          letter-spacing="3">

      CODESHIELD

    </text>

    <text x="292"
          y="152"
          fill="#A78BFA"
          font-size="15"
          letter-spacing="3">

      AGENTIC AI SECURITY ANALYSIS

    </text>

    <rect x="292"
          y="174"
          width="370"
          height="2"
          fill="url(#neon)"/>

    <text x="292"
          y="210"
          fill="#CBD5E1"
          font-size="14">

      Autonomous vulnerability investigation,

    </text>

    <text x="292"
          y="232"
          fill="#CBD5E1"
          font-size="14">

      validation and AI-assisted remediation.

    </text>

  </g>


  <!-- =====================================================
       PIPELINE
  ====================================================== -->

  <g transform="translate(290 260)"
     font-family="monospace">

    <!-- connections -->

    <g stroke="url(#neon)"
       stroke-width="1.5"
       fill="none"
       opacity=".7">

      <path d="M85 25H135"/>
      <path d="M225 25H275"/>
      <path d="M365 25H415"/>

    </g>


    <!-- nodes -->

    <g>

      <rect x="0"
            y="0"
            width="85"
            height="50"
            rx="6"
            fill="#090A13"
            stroke="#6366F1"/>

      <rect x="135"
            y="0"
            width="90"
            height="50"
            rx="6"
            fill="#090A13"
            stroke="#8B5CF6"/>

      <rect x="275"
            y="0"
            width="90"
            height="50"
            rx="6"
            fill="#090A13"
            stroke="#A855F7"/>

      <rect x="415"
            y="0"
            width="90"
            height="50"
            rx="6"
            fill="#090A13"
            stroke="#22D3EE"/>

    </g>


    <g fill="#CBD5E1"
       font-size="11"
       text-anchor="middle">

      <text x="42"
            y="30">
        ANALYZE
      </text>

      <text x="180"
            y="30">
        VALIDATE
      </text>

      <text x="320"
            y="30">
        REASON
      </text>

      <text x="460"
            y="30">
        REMEDIATE
      </text>

    </g>

  </g>


  <!-- =====================================================
       RIGHT SIDE — AI NETWORK
  ====================================================== -->

  <g fill="none"
     stroke="#8B5CF6"
     stroke-width="1.2"
     opacity=".35">

    <path d="M900 85L970 125L1040 90"/>
    <path d="M970 125L1005 190L1080 155"/>
    <path d="M900 85L925 180L1005 190"/>
    <path d="M1005 190L1060 240L1120 200"/>
    <path d="M1040 90L1080 155L1120 200"/>

  </g>


  <g fill="#A78BFA">

    <circle cx="900" cy="85" r="4"/>
    <circle cx="970" cy="125" r="4"/>
    <circle cx="1040" cy="90" r="4"/>
    <circle cx="925" cy="180" r="4"/>
    <circle cx="1005" cy="190" r="4"/>
    <circle cx="1080" cy="155" r="4"/>
    <circle cx="1060" cy="240" r="4"/>
    <circle cx="1120" cy="200" r="4"/>

  </g>


  <!-- =====================================================
       TECH TAGS
  ====================================================== -->

  <g font-family="monospace"
     font-size="11">

    <text x="850"
          y="290"
          fill="#22D3EE">

      LANGGRAPH

    </text>

    <text x="950"
          y="290"
          fill="#A78BFA">

      RAG

    </text>

    <text x="1000"
          y="290"
          fill="#22D3EE">

      SEMGREP

    </text>

    <text x="1080"
          y="290"
          fill="#A78BFA">

      AST

    </text>

  </g>


  <!-- =====================================================
       FOOTER STATUS
  ====================================================== -->

  <g font-family="monospace">

    <circle cx="72"
            cy="320"
            r="4"
            fill="#22D3EE"/>

    <text x="85"
          y="325"
          fill="#64748B"
          font-size="11"
          letter-spacing="1">

      AGENTIC SECURITY ENGINE // OPERATIONAL

    </text>

  </g>


  <!-- corner markers -->

  <g fill="#8B5CF6"
     opacity=".7">

    <rect x="30" y="30" width="35" height="2"/>
    <rect x="30" y="30" width="2" height="35"/>

    <rect x="1135" y="30" width="35" height="2"/>
    <rect x="1168" y="30" width="2" height="35"/>

    <rect x="30" y="328" width="35" height="2"/>
    <rect x="30" y="295" width="2" height="35"/>

    <rect x="1135" y="328" width="35" height="2"/>
    <rect x="1168" y="295" width="2" height="35"/>

  </g>

</svg>

<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080B"/>
      <stop offset="50%" stop-color="#09100F"/>
      <stop offset="100%" stop-color="#0A1114"/>
    </linearGradient>

    <!-- Main financial neon -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>

    <!-- Secondary -->
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle
    cx="1030"
    cy="175"
    r="260"
    fill="url(#glow)"
    filter="url(#blur)"
  />


  <!-- =====================================================
       GRID
  ====================================================== -->

  <g
    stroke="#22D3EE"
    stroke-width="1"
    opacity=".045"
  >

    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 300H1200"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>

  </g>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="60"
      y="48"
      fill="#22D3EE"
      font-size="13"
      letter-spacing="3"
    >
      PROJECT // 005
    </text>

    <text
      x="1140"
      y="48"
      fill="#84CC16"
      font-size="12"
      text-anchor="end"
      letter-spacing="2"
    >
      FINANCIAL_TRACKER
    </text>

  </g>


  <!-- =====================================================
       LEFT — FINANCIAL HUD
  ====================================================== -->

  <g transform="translate(55 78)">

    <!-- outer frame -->

    <rect
      x="0"
      y="0"
      width="215"
      height="190"
      rx="8"
      fill="#07100F"
      stroke="#1E3A3A"
    />


    <!-- top status -->

    <text
      x="20"
      y="25"
      fill="#64748B"
      font-family="monospace"
      font-size="9"
      letter-spacing="2"
    >
      FINANCIAL_HUD
    </text>


    <!-- balance -->

    <text
      x="20"
      y="55"
      fill="#64748B"
      font-family="monospace"
      font-size="9"
    >
      CURRENT BALANCE
    </text>

    <text
      x="20"
      y="82"
      fill="#F8FAFC"
      font-family="monospace"
      font-size="25"
      font-weight="700"
    >
      ₹ 42,850
    </text>


    <!-- mini graph -->

    <g
      fill="none"
      stroke="url(#neon)"
      stroke-width="2"
    >

      <path
        d="
          M20 125
          L45 118
          L68 128
          L92 108
          L115 114
          L138 92
          L160 100
          L190 76
        "
      />

    </g>


    <!-- graph glow -->

    <path
      d="
        M20 125
        L45 118
        L68 128
        L92 108
        L115 114
        L138 92
        L160 100
        L190 76
      "
      fill="none"
      stroke="#22D3EE"
      stroke-width="7"
      opacity=".10"
      filter="url(#softGlow)"
    />


    <!-- nodes -->

    <g fill="#22D3EE">

      <circle cx="20" cy="125" r="2.5"/>
      <circle cx="68" cy="128" r="2.5"/>
      <circle cx="115" cy="114" r="2.5"/>
      <circle cx="160" cy="100" r="2.5"/>
      <circle cx="190" cy="76" r="3"/>

    </g>


    <!-- footer -->

    <text
      x="20"
      y="168"
      fill="#64748B"
      font-family="monospace"
      font-size="9"
    >
      MONTHLY TREND
    </text>

    <text
      x="190"
      y="168"
      fill="#84CC16"
      font-family="monospace"
      font-size="9"
      text-anchor="end"
    >
      +12.4%
    </text>

  </g>


  <!-- =====================================================
       MAIN TITLE
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="315"
      y="108"
      fill="#F8FAFC"
      font-size="40"
      font-weight="700"
      letter-spacing="2"
    >
      FINANCE TRACKER
    </text>

    <text
      x="317"
      y="142"
      fill="#67E8F9"
      font-size="15"
      letter-spacing="3"
    >
      PERSONAL FINANCIAL CONTROL SYSTEM
    </text>

    <rect
      x="317"
      y="164"
      width="365"
      height="2"
      fill="url(#neon)"
    />

    <text
      x="317"
      y="200"
      fill="#CBD5E1"
      font-size="14"
    >
      Track spending, manage budgets,
    </text>

    <text
      x="317"
      y="222"
      fill="#CBD5E1"
      font-size="14"
    >
      and understand your financial habits.
    </text>

  </g>


  <!-- =====================================================
       RIGHT — ANALYTICS PANEL
  ====================================================== -->

  <g transform="translate(760 72)">

    <!-- panel -->

    <rect
      x="0"
      y="0"
      width="380"
      height="185"
      rx="8"
      fill="#070D0D"
      stroke="#1E293B"
    />


    <!-- panel heading -->

    <text
      x="20"
      y="25"
      fill="#64748B"
      font-family="monospace"
      font-size="9"
      letter-spacing="2"
    >
      SPENDING_ANALYTICS
    </text>


    <!-- bars -->

    <g>

      <!-- Food -->

      <text
        x="20"
        y="58"
        fill="#94A3B8"
        font-family="monospace"
        font-size="9"
      >
        FOOD
      </text>

      <rect
        x="85"
        y="48"
        width="190"
        height="12"
        rx="3"
        fill="#101A1A"
      />

      <rect
        x="85"
        y="48"
        width="130"
        height="12"
        rx="3"
        fill="#14B8A6"
      />


      <!-- Transport -->

      <text
        x="20"
        y="90"
        fill="#94A3B8"
        font-family="monospace"
        font-size="9"
      >
        TRAVEL
      </text>

      <rect
        x="85"
        y="80"
        width="190"
        height="12"
        rx="3"
        fill="#101A1A"
      />

      <rect
        x="85"
        y="80"
        width="92"
        height="12"
        rx="3"
        fill="#22D3EE"
      />


      <!-- Shopping -->

      <text
        x="20"
        y="122"
        fill="#94A3B8"
        font-family="monospace"
        font-size="9"
      >
        SHOPPING
      </text>

      <rect
        x="85"
        y="112"
        width="190"
        height="12"
        rx="3"
        fill="#101A1A"
      />

      <rect
        x="85"
        y="112"
        width="155"
        height="12"
        rx="3"
        fill="#8B5CF6"
      />


      <!-- Bills -->

      <text
        x="20"
        y="154"
        fill="#94A3B8"
        font-family="monospace"
        font-size="9"
      >
        BILLS
      </text>

      <rect
        x="85"
        y="144"
        width="190"
        height="12"
        rx="3"
        fill="#101A1A"
      />

      <rect
        x="85"
        y="144"
        width="112"
        height="12"
        rx="3"
        fill="#6366F1"
      />

    </g>


    <!-- percentage -->

    <g
      font-family="monospace"
      font-size="9"
      text-anchor="end"
    >

      <text
        x="350"
        y="58"
        fill="#14B8A6"
      >
        68%
      </text>

      <text
        x="350"
        y="90"
        fill="#22D3EE"
      >
        48%
      </text>

      <text
        x="350"
        y="122"
        fill="#A78BFA"
      >
        81%
      </text>

      <text
        x="350"
        y="154"
        fill="#818CF8"
      >
        59%
      </text>

    </g>

  </g>


  <!-- =====================================================
       SYSTEM PIPELINE
  ====================================================== -->

  <g
    transform="translate(315 270)"
    font-family="monospace"
  >

    <!-- connectors -->

    <g
      stroke="url(#neon)"
      stroke-width="1.5"
      opacity=".7"
    >

      <path d="M90 24H125"/>
      <path d="M220 24H255"/>
      <path d="M350 24H385"/>

    </g>


    <!-- nodes -->

    <g>

      <rect
        x="0"
        y="0"
        width="90"
        height="48"
        rx="6"
        fill="#07100F"
        stroke="#22D3EE"
      />

      <rect
        x="125"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#07100F"
        stroke="#14B8A6"
      />

      <rect
        x="255"
        y="0"
        width="95"
        height="48"
        rx="6"
        fill="#0D0A16"
        stroke="#8B5CF6"
      />

      <rect
        x="385"
        y="0"
        width="90"
        height="48"
        rx="6"
        fill="#07100F"
        stroke="#84CC16"
      />

    </g>


    <g
      fill="#CBD5E1"
      font-size="10"
      text-anchor="middle"
    >

      <text x="45" y="29">
        TRACK
      </text>

      <text x="172" y="29">
        CATEGORIZE
      </text>

      <text x="302" y="29">
        ANALYZE
      </text>

      <text x="430" y="29">
        CONTROL
      </text>

    </g>

  </g>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <g font-family="monospace">

    <circle
      cx="70"
      cy="320"
      r="4"
      fill="#84CC16"
    />

    <text
      x="85"
      y="325"
      fill="#64748B"
      font-size="11"
      letter-spacing="1"
    >
      FINANCE SYSTEM // BUDGET // EXPENSES // ANALYTICS
    </text>

  </g>


  <!-- =====================================================
       CORNER MARKERS
  ====================================================== -->

  <g fill="#22D3EE" opacity=".7">

    <rect x="25" y="25" width="35" height="2"/>
    <rect x="25" y="25" width="2" height="35"/>

    <rect x="1140" y="25" width="35" height="2"/>
    <rect x="1173" y="25" width="2" height="35"/>

    <rect x="25" y="333" width="35" height="2"/>
    <rect x="25" y="300" width="2" height="35"/>

    <rect x="1140" y="333" width="35" height="2"/>
    <rect x="1173" y="300" width="2" height="35"/>

  </g>


  <!-- =====================================================
       PARTICLES
  ====================================================== -->

  <g fill="#A7F3D0">

    <circle cx="290" cy="70" r="1"/>
    <circle cx="690" cy="75" r="1.5"/>
    <circle cx="715" cy="310" r="1"/>
    <circle cx="1080" cy="285" r="1.5"/>
    <circle cx="1130" cy="110" r="1"/>

  </g>

</svg>

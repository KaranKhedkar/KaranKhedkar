<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040509"/>
      <stop offset="50%" stop-color="#090A12"/>
      <stop offset="100%" stop-color="#10081A"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="300" fill="url(#bg)"/>

  <circle
    cx="600"
    cy="150"
    r="280"
    fill="url(#glow)"
    filter="url(#blur)"
  />


  <!-- GRID -->

  <g
    stroke="#6366F1"
    stroke-width="1"
    opacity=".04"
  >

    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>

    <path d="M100 0V300"/>
    <path d="M200 0V300"/>
    <path d="M300 0V300"/>
    <path d="M400 0V300"/>
    <path d="M500 0V300"/>
    <path d="M600 0V300"/>
    <path d="M700 0V300"/>
    <path d="M800 0V300"/>
    <path d="M900 0V300"/>
    <path d="M1000 0V300"/>
    <path d="M1100 0V300"/>

  </g>


  <!-- TOP TERMINAL -->

  <g font-family="monospace">

    <text
      x="600"
      y="55"
      text-anchor="middle"
      fill="#22D3EE"
      font-size="12"
      letter-spacing="4"
    >
      CONNECTION_TERMINAL
    </text>

    <text
      x="600"
      y="92"
      text-anchor="middle"
      fill="#F8FAFC"
      font-size="30"
      font-weight="700"
      letter-spacing="3"
    >
      LET'S BUILD SOMETHING
    </text>

    <text
      x="600"
      y="122"
      text-anchor="middle"
      fill="#A78BFA"
      font-size="14"
      letter-spacing="2"
    >
      AI · SOFTWARE · INTELLIGENT SYSTEMS
    </text>

  </g>


  <!-- NEON DIVIDER -->

  <rect
    x="430"
    y="145"
    width="340"
    height="2"
    fill="url(#neon)"
  />


  <!-- CONNECTION NODES -->

  <g font-family="monospace">

    <!-- LinkedIn -->

    <rect
      x="270"
      y="175"
      width="170"
      height="42"
      rx="6"
      fill="#080A12"
      stroke="#6366F1"
    />

    <circle
      cx="290"
      cy="196"
      r="5"
      fill="#6366F1"
    />

    <text
      x="305"
      y="200"
      fill="#CBD5E1"
      font-size="11"
    >
      LINKEDIN
    </text>


    <!-- GitHub -->

    <rect
      x="515"
      y="175"
      width="170"
      height="42"
      rx="6"
      fill="#080A12"
      stroke="#8B5CF6"
    />

    <circle
      cx="535"
      cy="196"
      r="5"
      fill="#A855F7"
    />

    <text
      x="550"
      y="200"
      fill="#CBD5E1"
      font-size="11"
    >
      GITHUB
    </text>


    <!-- Email -->

    <rect
      x="760"
      y="175"
      width="170"
      height="42"
      rx="6"
      fill="#080A12"
      stroke="#22D3EE"
    />

    <circle
      cx="780"
      cy="196"
      r="5"
      fill="#22D3EE"
    />

    <text
      x="795"
      y="200"
      fill="#CBD5E1"
      font-size="11"
    >
      EMAIL
    </text>

  </g>


  <!-- CONNECTING LINES -->

  <g
    stroke="url(#neon)"
    stroke-width="1"
    opacity=".5"
  >

    <path d="M440 196H515"/>
    <path d="M685 196H760"/>

  </g>


  <!-- STATUS -->

  <g font-family="monospace">

    <circle
      cx="510"
      cy="255"
      r="4"
      fill="#22D3EE"
    />

    <text
      x="525"
      y="259"
      fill="#64748B"
      font-size="10"
      letter-spacing="1"
    >
      SYSTEM_READY // AWAITING_NEXT_BUILD
    </text>

  </g>


  <!-- CORNER MARKERS -->

  <g fill="#8B5CF6" opacity=".7">

    <rect x="25" y="25" width="35" height="2"/>
    <rect x="25" y="25" width="2" height="35"/>

    <rect x="1140" y="25" width="35" height="2"/>
    <rect x="1173" y="25" width="2" height="35"/>

    <rect x="25" y="273" width="35" height="2"/>
    <rect x="25" y="240" width="2" height="35"/>

    <rect x="1140" y="273" width="35" height="2"/>
    <rect x="1173" y="240" width="2" height="35"/>

  </g>


  <!-- PARTICLES -->

  <g fill="#C4B5FD">

    <circle cx="190" cy="100" r="1"/>
    <circle cx="230" cy="245" r="1.5"/>
    <circle cx="970" cy="90" r="1"/>
    <circle cx="1010" cy="250" r="1.5"/>
    <circle cx="600" cy="25" r="1"/>

  </g>

</svg>
